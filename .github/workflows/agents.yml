name: crypto agents

on:
  schedule:
    - cron: "7 * * * *"      # every hour at :07 (keeps a private repo inside GitHub's free 2,000 min/month)
  workflow_dispatch: {}       # "Run workflow" button for a manual run

permissions:
  contents: write             # lets the job save the paper ledgers back to the repo

concurrency:
  group: crypto-agents
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: follow agent ($0)
        run: python run.py --once
        env: { STRATEGY: follow }
        continue-on-error: true

      - name: trend agent ($0)
        run: python run.py --once
        env: { STRATEGY: trend }
        continue-on-error: true

      - name: news agent (only if an API key secret is set)
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: python run.py --once
        env:
          STRATEGY: news
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MONTHLY_BUDGET: ${{ vars.MONTHLY_BUDGET || '10' }}
        continue-on-error: true

      - name: update STATUS.md
        run: python status.py

      - name: save ledgers
        run: |
          git config user.name "crypto-agents"
          git config user.email "actions@users.noreply.github.com"
          git add -f agent_*.db STATUS.md
          git commit -m "agents: $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to save"
          git push
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MODE: paper
